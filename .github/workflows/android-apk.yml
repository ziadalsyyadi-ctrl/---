name: Build Android Packages (AAB for Google Play & APK for Direct Install)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Google Play AAB & Direct Install APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استنساخ المستودع (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # جلب كافة الـ Commits لضمان عمل الـ Tags والتزامن الصحيح

      - name: ☕ إعداد بيئة جافا (Set up Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 إعداد Node.js (Set up Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 تثبيت حزم المشروع (Install Dependencies)
        run: |
          npm install --legacy-peer-deps

      - name: 🏗️ بناء صفحات الويب (Build Web Assets)
        run: |
          npm run build

      - name: 📱 تجهيز ومزامنة تطبيق الأندرويد (Setup Android Platform)
        run: |
          if [ ! -d "android" ]; then
            echo "جاري إنشاء بيئة الأندرويد عبر Capacitor..."
            npx cap add android
          fi
          npx cap sync android

      - name: 🔑 تجهيز مفتاح التوقيع (Setup Release Keystore if provided)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "تم العثور على مفتاح التوقيع المخصص في أسرار المستودع، جاري فك التشفير..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
            echo "KEYSTORE_FILE=release-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "لم يتم تمرير مفتاح مخصص، سيتم التوقيع التلقائي الآمن المتوافق مع Google Play App Signing."
          fi

      - name: ⚙️ بناء حزمة متجر غوغل بلاي (Build Google Play AAB Bundle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
          cd ..

      - name: ⚙️ بناء ملف التثبيت المباشر (Build Direct Install APK)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

      - name: 📋 تنظيم وتسمية ملفات الإصدار النهائية
        run: |
          mkdir -p release_files
          find android/app/build/outputs/bundle/ -name "*.aab" -exec cp {} release_files/Bank_AlDam_Qataba.aab \;
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release_files/Bank_AlDam_Qataba.apk \;
          ls -la release_files/

      - name: 🚀 رفع حزمة غوغل بلاي AAB كـ Artifact للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Bank_AlDam_Qataba_GooglePlay_AAB
          path: release_files/Bank_AlDam_Qataba.aab
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 رفع ملف APK المباشر كـ Artifact للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Bank_AlDam_Qataba_APK
          path: release_files/Bank_AlDam_Qataba.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🌟 توليد رقم إصدار ديناميكي فريد
        id: tag
        run: |
          TAG_NAME="v1.0.$(date +%Y%m%d%H%M%S)"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "تم إنشاء Tag فريد: $TAG_NAME"

      - name: 🌟 نشر الحزم في قسم Releases على GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }} # يربط الإصدار بالالتزام الحالي بدقة
          name: "إصدار تطبيق بنك الدم - قعطبة (${{ steps.tag.outputs.tag_name }})"
          body: |
            ### 📱 تطبيق بنك الدم - مديرية قعطبة (قطرة دم تنقذ حياة إنسان)
            
            تم بناء الحزم المخصصة للنشر والتثبيت بنجاح:
            
            1. **`Bank_AlDam_Qataba.aab`** *(Android App Bundle)*:
               - **الاستخدام:** هذا هو الملف المطلوب والمطابق لسياسة **Google Play Console** لنشر التطبيق في المتجر.
            
            2. **`Bank_AlDam_Qataba.apk`** *(Application Package)*:
               - **الاستخدام:** هذا الملف مخصص للتثبيت المباشر على هواتف الأندرويد والمشاركة عبر واتساب وتلغرام والتجربة الميدانية.
            
            - **معرّف الحزمة (Package ID):** `com.blood.qataba`
            - **الإصدار:** `1.0.0` (versionCode: 1)
            - **الهدف البرمجي (Target SDK):** 36 (متوافق مع أحدث شروط غوغل بلاي)
          draft: false
          prerelease: false
          files: |
            release_files/Bank_AlDam_Qataba.aab
            release_files/Bank_AlDam_Qataba.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
