<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>وضع عدم الاتصال | قطرة دم - قعطبة</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        direction: rtl;
        text-align: center;
      }
      .card {
        background: white;
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        max-width: 420px;
        margin: 1rem;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0;
      }
      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        background: #fee2e2;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        color: #b91c1c;
        margin-bottom: 0.75rem;
      }
      p {
        color: #64748b;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.75rem;
      }
      .btn {
        display: inline-block;
        background: #dc2626;
        color: white;
        text-decoration: none;
        padding: 0.75rem 1.75rem;
        border-radius: 0.75rem;
        font-weight: bold;
        transition: 0.2s;
        border: none;
        cursor: pointer;
      }
      .btn:hover {
        background: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🩸</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>
        يمكنك تصفح سجل المتبرعين المحفوظ مسبقاً على جهازك. عند استعادة الاتصال بالإنترنت، سيتم تحديث البيانات تلقائياً.
      </p>
      <button class="btn" onclick="window.location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
