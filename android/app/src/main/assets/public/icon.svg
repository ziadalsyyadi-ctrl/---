<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7f1d1d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Circle for App Icon -->
  <rect width="512" height="512" rx="110" fill="url(#grad)"/>
  
  <!-- Subtle Pulse Wave in background -->
  <path d="M 40 256 H 140 L 170 190 L 210 320 L 240 230 L 270 270 L 290 256 H 472" 
        fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blood Drop Shape -->
  <g filter="url(#shadow)">
    <path d="M 256 90 
             C 256 90 130 250 130 330 
             A 126 126 0 0 0 382 330 
             C 382 250 256 90 256 90 Z" 
          fill="#ffffff"/>
          
    <!-- Inner Red Drop / Heart -->
    <path d="M 256 140 
             C 256 140 160 266 160 330 
             A 96 96 0 0 0 352 330 
             C 352 266 256 140 256 140 Z" 
          fill="url(#grad)"/>
          
    <!-- White Heart at the Center -->
    <path d="M 256 295
             C 245 280 205 240 190 265
             C 175 290 195 320 256 365
             C 317 320 337 290 322 265
             C 307 240 267 280 256 295 Z" 
          fill="#ffffff"/>

    <!-- Pulse Line over heart -->
    <path d="M 210 305 L 235 305 L 246 280 L 260 330 L 272 295 L 282 312 L 302 305" 
          fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
